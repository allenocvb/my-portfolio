<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem("portfolio-theme"); } catch { /* Storage may be disabled. */ }
        document.documentElement.dataset.theme = saved === "light" || saved === "dark"
          ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    <title>Allen Odoom - Software Engineer Portfolio</title>
    <meta
      name="description"
      content="Allen Odoom's portfolio showcasing software engineering projects, experiences, and skills. Explore my work in web development, mobile apps, and more."
    />
    <link rel="canonical" href="https://allenodoom.com" />
    <link rel="preload" as="image" href="/head.jpeg" />
    <link rel="preload" as="fetch" href="/effect.webm" />
    <link rel="icon" type="image/png" href="/head.jpeg" />
    <link rel="stylesheet" href="/src/styles/index.css" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allenodoom.com/" />
    <meta
      property="og:title"
      content="Allen Odoom - Software Engineer Portfolio"
    />
    <meta
      property="og:description"
      content="Explore Allen Odoom's software engineering projects, experiences, and skills in web development and mobile apps."
    />
    <meta property="og:image" content="https://allenodoom.com/head.jpeg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://allenodoom.com/" />
    <meta
      property="twitter:title"
      content="Allen Odoom - Software Engineer Portfolio"
    />
    <meta
      property="twitter:description"
      content="Explore Allen Odoom's software engineering projects, experiences, and skills in web development and mobile apps."
    />
    <meta property="twitter:image" content="https://allenodoom.com/head.jpeg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Person",
        "name": "Allen Odoom",
        "url": "https://allenodoom.com",
        "jobTitle": "Software Engineer",
        "description": "Allen Odoom is a software engineer specializing in web development and mobile applications.",
        "image": "https://allenodoom.com/head.jpeg",
        "sameAs": [
          "https://github.com/allenocvb",
          "https://www.linkedin.com/in/allen-odoom/"
        ]
      }
    </script>
  </head>
  <body class="overflow-hidden">
    <!-- VCR intro. It sits outside #root so the site can render behind it before the reveal. -->
    <div id="intro" aria-hidden="true">
      <div
        id="vcr"
        class="overlay absolute inset-0 flex flex-col bg-black pointer-events-none w-full text-4xl sm:text-5xl md:text-6xl lg:text-8xl h-full pb-32 p-8 md:p-16 text-white font-mono"
      >
        <div
          class="flex justify-between mb-auto animate-pulse motion-reduce:animate-none"
        >
          <p class="glitch">PLAY ►</p>
          <p class="glitch">--:--</p>
        </div>
        <div class="flex mx-auto animate-pulse motion-reduce:animate-none">
          <p
            id="reminder"
            class="transition duration-500 glitch text-md sm:text-lg md:text-xl lg:text-2xl opacity-0"
          >
            click to begin
          </p>
        </div>
        <div
          class="flex justify-between mt-auto animate-pulse motion-reduce:animate-none"
          id="marker"
        >
          <p class="glitch">SP</p>
        </div>
      </div>
      <canvas class="intro-noise" width="160" height="100"></canvas>
      <div class="intro-tracking"></div>
    </div>
    <div id="root"></div>
    <script>
      // Immediately hide the VCR intro for non-home routes to prevent a flash
      if (window.location.pathname !== "/") {
        document.getElementById("intro").style.display = "none";
        document.body.classList.remove("overflow-hidden");
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
